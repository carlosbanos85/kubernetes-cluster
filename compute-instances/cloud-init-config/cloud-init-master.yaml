#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.${cluster_domain}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - vim
  - git
  - unzip

# Configure system settings for k3s
write_files:
  - path: /etc/sysctl.d/k3s-cilium.conf
    content: |
      ${indent(6, sysctl_config)}
    permissions: "0644"

  - path: /etc/modules-load.d/k3s-cilium.conf
    content: |
      ${indent(6, modules_config)}
    permissions: "0644"

  - path: /tmp/cilium/values.yaml
    content: |
      ${indent(6, cilium_values_config)}
    permissions: "0644"

  - path: /etc/systemd/system/k3s-install.service
    content: |
      ${indent(6, k3s_service_config)}
    permissions: "0644"

  - path: /etc/systemd/system/helm-install.service
    content: |
      ${indent(6, helm_service_config)}
    permissions: "0644"

  - path: /etc/systemd/system/cilium-install.service
    content: |
      ${indent(6, cilium_service_config)}
    permissions: "0644"

  - path: /opt/k3s-install.sh
    content: |
      ${indent(6, k3s_install_script)}
    permissions: "0755"

  - path: /opt/helm-install.sh
    content: |
      ${indent(6, helm_install_script)}
    permissions: "0755"

  - path: /opt/cilium-install.sh
    content: |
      ${indent(6, cilium_install_script)}
    permissions: "0755"

runcmd:
  # Load kernel modules
  - modprobe br_netfilter
  - modprobe overlay
  - modprobe ip_tables
  - modprobe ip6_tables
  - modprobe nf_conntrack

  # Apply sysctl settings
  - sysctl -p /etc/sysctl.d/k3s-cilium.conf

  # Set up firewall rules for k3s
  - firewall-cmd --permanent --add-port=6443/tcp # K8s API
  - firewall-cmd --permanent --add-port=10250/tcp # Kubelet
  - firewall-cmd --permanent --add-port=4240/tcp # Cilium health
  - firewall-cmd --permanent --add-port=4244/tcp # Hubble gRPC
  - firewall-cmd --permanent --add-port=4245/tcp # Hubble Relay
  - firewall-cmd --permanent --add-port=8472/udp # VXLAN
  - firewall-cmd --permanent --add-port=2379-2380/tcp # ETCD
  - firewall-cmd --permanent --add-port=80/tcp # HTTP
  - firewall-cmd --permanent --add-port=443/tcp # HTTPS
  - firewall-cmd --permanent --add-port=30080/tcp # Hubble UI
  - firewall-cmd --reload

  # Enable and start the k3s installation service
  - systemctl enable k3s-install.service
  - systemctl start k3s-install.service

  - mkdir -p /home/opc/.kube
  - cp /etc/rancher/k3s/k3s.yaml /home/opc/.kube/config
  - chown opc:opc /home/opc/.kube/config

  # Enable and start the Helm installation service
  - systemctl enable helm-install.service
  - systemctl start helm-install.service

  # Enable and start the Cilium installation service
  - systemctl enable cilium-install.service
  - systemctl start cilium-install.service

final_message: "K3s master node setup completed. Check /var/log/cloud-init-output.log for details."
