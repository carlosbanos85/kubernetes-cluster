hostname: ${hostname}
fqdn: ${hostname}.${cluster_domain}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - vim
  - htop
  - git
  - unzip

# Configure system settings for k3s
write_files:
  - path: /etc/sysctl.d/k3s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    permissions: "0644"

  - path: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    permissions: "0644"

  - path: /etc/systemd/system/k3s-install.service
    content: |
      [Unit]
      Description=Install K3s
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/opt/k3s-install.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /opt/k3s-install.sh
    content: |
      #!/bin/bash
      set -e

      # Wait for network to be ready
      until ping -c 1 8.8.8.8 &> /dev/null; do
        echo "Waiting for network..."
        sleep 5
      done

      # Install k3s server
      curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server" sh -s - \
        ${k3s_disable_flags} \
        --node-name ${hostname} \
        --cluster-init \
        --cluster-cidr="10.42.0.0/16" \
        --service-cidr="10.43.0.0/16" \
        --cluster-dns="10.43.0.10" \
        --cluster-domain="${cluster_domain}" \
        --write-kubeconfig-mode 644 \
        --kube-apiserver-arg="--service-node-port-range=30000-32767"

      # Wait for k3s to be ready
      until kubectl get nodes &> /dev/null; do
        echo "Waiting for k3s to be ready..."
        sleep 10
      done

      # Save the node token for workers
      cp /var/lib/rancher/k3s/server/node-token /tmp/node-token
      chmod 644 /tmp/node-token

      # Create kubeconfig for external access
      cp /etc/rancher/k3s/k3s.yaml /tmp/k3s-external.yaml
      sed -i 's/127.0.0.1:6443/${hostname}:6443/g' /tmp/k3s-external.yaml
      chmod 644 /tmp/k3s-external.yaml

      echo "K3s master installation completed"
    permissions: "0755"

runcmd:
  # Load kernel modules
  - modprobe br_netfilter
  - modprobe overlay

  # Apply sysctl settings
  - sysctl -p /etc/sysctl.d/k3s.conf

  # Enable and start the k3s installation service
  - systemctl enable k3s-install.service
  - systemctl start k3s-install.service

  # Set up firewall rules for k3s
  - firewall-cmd --permanent --add-port=6443/tcp
  - firewall-cmd --permanent --add-port=10250/tcp
  - firewall-cmd --permanent --add-port=8472/udp
  - firewall-cmd --permanent --add-port=80/tcp
  - firewall-cmd --permanent --add-port=443/tcp
  - firewall-cmd --permanent --add-port=30000-32767/tcp
  - firewall-cmd --reload

final_message: "K3s master node setup completed. Check /var/log/cloud-init-output.log for details."
