#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.${cluster_domain}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - vim
  - git
  - unzip
  - ufw
  - linux-modules-extra-$(uname -r)

# Configure system settings for k3s
write_files:
  - path: /etc/sysctl.d/k3s-cilium.conf
    content: |
      ${indent(6, sysctl_config)}
    permissions: "0644"

  - path: /etc/modules-load.d/k3s-cilium.conf
    content: |
      ${indent(6, modules_config)}
    permissions: "0644"

  - path: /tmp/cilium/values.yaml
    content: |
      ${indent(6, cilium_values_config)}
    permissions: "0644"

  - path: /etc/systemd/system/k3s-install.service
    content: |
      ${indent(6, k3s_service_config)}
    permissions: "0644"

  - path: /etc/systemd/system/helm-install.service
    content: |
      ${indent(6, helm_service_config)}
    permissions: "0644"

  - path: /etc/systemd/system/cilium-install.service
    content: |
      ${indent(6, cilium_service_config)}
    permissions: "0644"

  - path: /opt/k3s-install.sh
    content: |
      ${indent(6, k3s_install_script)}
    permissions: "0755"

  - path: /opt/helm-install.sh
    content: |
      ${indent(6, helm_install_script)}
    permissions: "0755"

  - path: /opt/cilium-install.sh
    content: |
      ${indent(6, cilium_install_script)}
    permissions: "0755"

runcmd:
  # Load all required kernel modules
  - modprobe br_netfilter
  - modprobe overlay
  - modprobe ip_tables
  - modprobe ip6_tables
  - modprobe nf_conntrack
  - modprobe vxlan
  - modprobe xt_REDIRECT
  - modprobe xt_owner
  - modprobe iptable_nat
  - modprobe iptable_mangle
  - modprobe iptable_raw
  - modprobe xt_socket
  - modprobe ip6table_mangle

  # Apply sysctl settings
  - sysctl -p /etc/sysctl.d/k3s-cilium.conf

  - iptables -I INPUT -p tcp --dport 6443 -j ACCEPT # Kubernetes API server
  - iptables -I INPUT -p tcp --dport 4244 -j ACCEPT # Cilium Hubble
  - iptables -I INPUT -p tcp --dport 4244 -j ACCEPT # Cilium Hubble gRPC
  - iptables -I INPUT -p tcp --dport 4240 -j ACCEPT # Cilium health checks
  - iptables -I INPUT -p tcp --dport 4245 -j ACCEPT # Hubble Relay

  # Complete firewall configuration for K3s + Cilium
  - ufw --force enable

  - ufw allow 53/udp # CoreDNS

  # Core K3s ports
  - ufw allow 22/tcp # SSH
  - ufw allow 6443/tcp # Kubernetes API server
  - ufw allow 10250/tcp # Kubelet API
  - ufw allow 2379:2380/tcp # etcd (HA clusters)

  # Cilium ports
  - ufw allow 4240/tcp # Cilium health checks
  - ufw allow 4244/tcp # Hubble gRPC API
  - ufw allow 4245/tcp # Hubble Relay
  - ufw allow 8472/udp # VXLAN tunnel endpoint
  - ufw allow 9962:9965/tcp # Cilium agent health & metrics

  # OCI Load Balancer health checks
  - ufw allow 10256/tcp # Kubernetes health check endpoint

  # Application ports (will be handled by OCI LB)
  - ufw allow 80/tcp # HTTP
  - ufw allow 8080/tcp # HTTP
  - ufw allow 443/tcp # HTTPS

  # Internal cluster communication (from VCN CIDR)
  - ufw allow from 10.0.0.0/8 to any

  - ufw reload

  # Enable and start services in order
  - systemctl daemon-reload

  # 1. Install K3s with cloud provider external
  - systemctl enable k3s-install.service
  - systemctl start k3s-install.service

  - mkdir -p /home/ubuntu/.kube
  - cp /etc/rancher/k3s/k3s.yaml /home/ubuntu/.kube/config
  - chown ubuntu:ubuntu /home/ubuntu/.kube/config
  - chmod 600 /home/ubuntu/.kube/config

  # 2. Install Helm
  - systemctl enable helm-install.service
  - systemctl start helm-install.service

  - |
    while ! kubectl get configmap coredns -n kube-system >/dev/null 2>&1; do
      echo "Waiting for CoreDNS configmap..."
      sleep 10
    done

    kubectl patch configmap coredns -n kube-system --patch='
    data:
      Corefile: |
        .:53 {
            errors
            health
            ready
            kubernetes cluster.local in-addr.arpa ip6.arpa {
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
            }
            hosts /etc/coredns/NodeHosts {
              ttl 60
              reload 15s
              fallthrough
            }
            prometheus :9153
            forward . /etc/resolv.conf
            cache 30
            loop
            reload
            loadbalance
            import /etc/coredns/custom/*.override
        }
        import /etc/coredns/custom/*.server'

    kubectl rollout restart deployment/coredns -n kube-system

  # 3. Install Cilium
  - systemctl enable cilium-install.service
  - systemctl start cilium-install.service

final_message: "K3s master node setup completed. Check /var/log/cloud-init-output.log for details."
