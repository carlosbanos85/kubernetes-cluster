hostname: ${hostname}
fqdn: ${hostname}.${cluster_domain}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - vim
  - htop
  - git
  - unzip

# Configure system settings for k3s
write_files:
  - path: /etc/sysctl.d/k3s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    permissions: "0644"

  - path: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    permissions: "0644"

  - path: /etc/systemd/system/k3s-join.service
    content: |
      [Unit]
      Description=Join K3s cluster
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/opt/k3s-join.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /opt/k3s-join.sh
    content: |
      #!/bin/bash
      set -e

      MASTER_IP="${master_ip}"
      MASTER_PUBLIC_IP="${master_public_ip}"
      MAX_RETRIES=30
      RETRY_COUNT=0

      # Wait for network to be ready
      until ping -c 1 8.8.8.8 &> /dev/null; do
        echo "Waiting for network..."
        sleep 5
      done

      echo "Waiting for master node to be ready..."

      # Wait for master to be accessible and token to be available
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Checking master node..."

        # Check if we can reach the master API
        if curl -k -s --connect-timeout 5 https://$MASTER_IP:6443/readyz &> /dev/null; then
          echo "Master API is accessible"

          # Try to get the node token via SSH
          TOKEN=""
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes opc@$MASTER_PUBLIC_IP "sudo cat /var/lib/rancher/k3s/server/node-token" &> /tmp/token.txt 2>/dev/null; then
            TOKEN=$(cat /tmp/token.txt)
            rm -f /tmp/token.txt
          fi

          if [ -n "$TOKEN" ]; then
            echo "Got node token, joining cluster..."

            # Install k3s agent and join cluster
            curl -sfL https://get.k3s.io | K3S_URL=https://$MASTER_IP:6443 K3S_TOKEN="$TOKEN" sh -s - \
              --node-name ${hostname}

            echo "Successfully joined k3s cluster"
            exit 0
          fi
        fi

        RETRY_COUNT=$((RETRY_COUNT + 1))
        echo "Master not ready yet, waiting 30 seconds..."
        sleep 30
      done

      echo "Failed to join cluster after $MAX_RETRIES attempts"
      # Fall back to simplified join method
      /opt/wait-and-join.sh
    permissions: "0755"

  - path: /opt/wait-and-join.sh
    content: |
      #!/bin/bash
      # Alternative simpler join method
      set -e

      MASTER_IP="${master_ip}"

      # Wait longer for master to be fully ready
      echo "Waiting 5 minutes for master to be fully initialized..."
      sleep 300

      # Install k3s with a simple retry mechanism
      for i in {1..10}; do
        echo "Join attempt $i..."

        # Try to install k3s agent
        if curl -sfL https://get.k3s.io | K3S_URL=https://$MASTER_IP:6443 K3S_TOKEN_FILE=/tmp/k3s-token sh -s - --node-name ${hostname}; then
          echo "Successfully joined cluster on attempt $i"
          break
        else
          echo "Join attempt $i failed, retrying in 60 seconds..."
          sleep 60
        fi

        if [ $i -eq 10 ]; then
          echo "Failed to join after 10 attempts"
          exit 1
        fi
      done
    permissions: "0755"

runcmd:
  # Load kernel modules
  - modprobe br_netfilter
  - modprobe overlay

  # Apply sysctl settings
  - sysctl -p /etc/sysctl.d/k3s.conf

  # Set up firewall rules for k3s
  - firewall-cmd --permanent --add-port=10250/tcp
  - firewall-cmd --permanent --add-port=8472/udp
  - firewall-cmd --permanent --add-port=30000-32767/tcp
  - firewall-cmd --reload

  # Enable and start the k3s join service
  - systemctl enable k3s-join.service
  - systemctl start k3s-join.service

final_message: "K3s worker node setup completed. Check /var/log/cloud-init-output.log for details."
