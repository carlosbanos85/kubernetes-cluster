#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.${cluster_domain}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - vim
  - git
  - unzip

# Configure system settings for k3s
write_files:
  - path: /etc/sysctl.d/k3s-cilium.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
      net.core.bpf_jit_enable = 1
      net.core.bpf_jit_harden = 0
    permissions: "0644"

  - path: /etc/modules-load.d/k3s-cilium.conf
    content: |
      br_netfilter
      overlay
      ip_tables
      ip6_tables
      nf_conntrack
    permissions: "0644"

  - path: /etc/systemd/system/k3s-join.service
    content: |
      [Unit]
      Description=Join K3s cluster
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/opt/k3s-join.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

  - path: /opt/k3s-join.sh
    content: |
      #!/bin/bash
      set -e

      MASTER_IP="${master_ip}"
      MASTER_PUBLIC_IP="${master_public_ip}"
      K3S_TOKEN=""
      MAX_RETRIES=30
      RETRY_COUNT=0

      # Wait for network to be ready
      until ping -c 1 8.8.8.8 &> /dev/null; do
        echo "Waiting for network..."
        sleep 5
      done

      echo "Waiting for master node to be ready..."

      # Wait for master to be accessible, K3s running, and Cilium installed
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Checking master node with Cilium..."

        # Check if we can reach the master API
        if curl -k -s --connect-timeout 5 https://$MASTER_IP:6443/readyz &> /dev/null; then
          echo "Master API is accessible"

          # Check if Cilium is ready on the master
          CILIUM_READY=false
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes opc@$MASTER_PUBLIC_IP "kubectl get pods -n kube-system -l k8s-app=cilium --no-headers | grep -q Running" &> /dev/null; then
            echo "Cilium is running on master"
            CILIUM_READY=true
          fi

          # Install k3s agent and join cluster
          curl -sfL https://get.k3s.io | K3S_URL=https://$MASTER_IP:6443 K3S_TOKEN="$K3S_TOKEN" sh -s - \
            --node-name ${hostname}

          # Wait for node to be ready
          echo "Waiting for node to be ready in cluster..."
          sleep 30
          exit 0
        fi

        RETRY_COUNT=$((RETRY_COUNT + 1))
        if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
          echo "Master with Cilium not ready yet, waiting 30 seconds..."
          sleep 30
        fi
      done

      echo "Failed to join cluster after $MAX_RETRIES attempts"
      echo "This may be due to Cilium still initializing. Manual intervention may be required."
      exit 1
    permissions: "0755"

runcmd:
  # Load kernel modules
  - modprobe br_netfilter
  - modprobe overlay
  - modprobe ip_tables
  - modprobe ip6_tables
  - modprobe nf_conntrack

  # Apply sysctl settings
  - sysctl -p /etc/sysctl.d/k3s-cilium.conf

  # Add master hostname resolution
  - echo "${master_ip} ${master_hostname}" >> /etc/hosts

  # Set up firewall rules for k3s
  - firewall-cmd --permanent --add-port=10250/tcp # Kubelet
  - firewall-cmd --permanent --add-port=4240/tcp # Cilium health
  - firewall-cmd --permanent --add-port=4244/tcp # Hubble gRPC
  - firewall-cmd --permanent --add-port=8472/udp # VXLAN
  - firewall-cmd --reload

  # Enable and start the k3s join service
  - systemctl enable k3s-join.service

final_message: "K3s worker node setup completed. Check /var/log/cloud-init-output.log for details."
