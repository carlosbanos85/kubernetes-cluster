cluster:
  name: ${cluster_name}
  id: 1

kubeProxyReplacement: true

k8sServiceHost: ${master_ip}
k8sServicePort: 6443

bgpControlPlane:
  enabled: true

bgp:
  enabled: true
  announce:
    loadbalancerIP: true
    podCIDR: false

l2announcements:
  enabled: false

externalIPs:
  enabled: true

ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

ipv4:
  enabled: true
ipv6:
  enabled: false

operator:
  rollOutPods: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

rollOutCiliumPods: true

hubble:
  enabled: true
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true

# Gateway API for advanced routing
gatewayAPI:
  enabled: true

envoy:
  enabled: true
