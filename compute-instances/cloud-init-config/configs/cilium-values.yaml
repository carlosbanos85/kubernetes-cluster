cluster:
  name: ${cluster_name}
  id: 1

# Gateway API for advanced routing
gatewayAPI:
  enabled: true

# Enable Envoy for L7 features
envoy:
  enabled: true
  rollOutPods: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [NET_ADMIN, PERFMON, BPF]

kubeProxyReplacement: true

k8sServiceHost: ${master_ip}
k8sServicePort: 6443

# Disable BGP
bgpControlPlane:
  enabled: false
bgp:
  enabled: false

# Disable L2 announcements
l2announcements:
  enabled: false

# Disable ingress controller for Gateway API
ingressController:
  enabled: false

externalIPs:
  enabled: true

# Enable LB-IPAM features
loadBalancer:
  l7:
    backend: envoy
  acceleration: best-effort

ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

ipv4:
  enabled: true
ipv6:
  enabled: false

operator:
  rollOutPods: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

rollOutCiliumPods: true

hubble:
  enabled: true
  relay:
    enabled: true
    rollOutPods: true
  ui:
    enabled: true
    rollOutPods: true

# Security context for eBPF
securityContext:
  capabilities:
    ciliumAgent:
      [
        CHOWN,
        KILL,
        NET_ADMIN,
        NET_RAW,
        IPC_LOCK,
        SYS_ADMIN,
        SYS_RESOURCE,
        DAC_OVERRIDE,
        FOWNER,
        SETGID,
        SETUID,
      ]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Performance optimizations
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi
